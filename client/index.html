<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wishlist</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <link rel="stylesheet" href="css/tailwind-output.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-warm-50 font-['Roboto'] min-h-screen">

  <div id="app" class="max-w-[480px] mx-auto min-h-screen flex flex-col">

    <main class="relative flex-1 px-4 flex flex-col">
      <!-- Screen 0: Welcome -->
      <div id="screen-welcome" class="screen flex-1 flex flex-col items-center justify-center p-6">
        <div class="tree-container">
          <img src="/images/tree.png" alt="Дерево">
        </div>

        <h1 class="text-5xl font-bold text-center text-primary mb-2">ПОДАРИ</br>ТИМУРУ</br>ДЕРЕВО</h1>
        <button id="btn-start" class="w-full max-w-xs bg-primary hover:bg-primary-dark text-white font-medium py-4 rounded-full text-base shadow-[0_4px_10px_rgba(107,142,107,0.3)]">
          НАЧАТЬ
        </button>
      
      </div>

      <!-- Screen 1: Guest Selection -->
      <div id="screen-guest" class="screen pt-8" style="display: none;">
        <h1 class="text-2xl font-bold text-center text-primary mb-2">ВЫБЕРИ СЕБЯ:</h1>
        
        <div class="mb-6">
          <ul id="guest-list" class="w-full border border-sage-200 rounded-lg divide-y divide-sage-100 overflow-hidden"></ul>
        </div>
        <button id="btn-select-guest" class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          К ПОДАРКАМ
        </button>
      </div>

      <!-- Screen 2: Gift Selection -->
      <div id="screen-gifts" class="screen pt-4" style="display: none;">
        <h1 class="text-2xl font-bold text-center text-primary mb-2"><span id="guest-name-display-gifts"></span>,</h1>
        <h2  class="text-2l font-bold text-sage-300 text-center mb-8">Выберите подарок из списка:</h2>
        <div id="gifts-list" class="space-y-3 mb-4"></div>
      </div>

      <!-- Screen 3: Saved List -->
      <div id="screen-saved" class="screen pt-4" style="display: none;">
        <h1 class="text-2xl font-bold text-center text-primary mb-2"><span id="guest-name-display"></span>,</h1>
        <h2  class="text-2l font-bold text-sage-300 text-center mb-8">Ваш список подарков:</h2>
        <div id="saved-list" class="space-y-3 mb-4"></div>
        <div id="send-buttons" class="flex flex-col gap-3 mb-4">
          <div class="flex items-center gap-2">
            <button data-action="restart" class="bg-warm-200 hover:bg-warm-300 text-gray-700 px-3 py-2 rounded-lg text-base font-medium whitespace-nowrap flex-shrink-0">
              В НАЧАЛО
            </button>
            <button id="btn-back" class="flex-1 bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base disabled:opacity-50 disabled:cursor-not-allowed">
              РЕДАКТИРОВАТЬ
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer id="app-footer" style="display: none;">
      <div id="footer-gifts" style="display: none;" class="px-4 py-3 border-t border-sage-200 bg-warm-50 shadow-[0_-2px_4px_rgba(0,0,0,0.03)]">
        <div id="selection-summary" class="text-xl text-sage-300 text-center mb-3">
          Выбрано: <span id="selected-count">0</span> шт, на сумму ~ <span id="selected-total">0</span> ₽
        </div>
        <div class="flex items-center gap-2">
          <button data-action="restart" class="bg-warm-200 hover:bg-warm-300 text-gray-700 px-3 py-2 rounded-lg text-base font-medium whitespace-nowrap flex-shrink-0">
            В НАЧАЛО
          </button>
          <button id="btn-clear-footer"  class="bg-danger hover:bg-danger-dark text-white px-3 py-2 rounded-lg text-base font-medium whitespace-nowrap flex-shrink-0">
            ОЧИСТИТЬ
          </button>
          <button id="btn-save" class="flex-1 bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            СОХРАНИТЬ
          </button>
        </div>
      </div>
    </footer>

    <!-- Modal -->
    <div id="gift-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
      <div id="modal-overlay" class="absolute inset-0 bg-warm-50/70"></div>
      <div class="relative bg-warm-50 rounded-2xl w-full max-w-[400px] max-h-[80vh] overflow-y-auto p-6 z-10 shadow-lg">
        <img id="modal-image" src="" alt="" class="w-full h-48 object-cover rounded-xl mb-4 shadow-sm">
        <h3 id="modal-name" class="text-xl font-bold text-gray-900 mb-2"></h3>
        <p id="modal-description" class="text-sage-300 text-sm mb-4"></p>
        <div class="flex items-center gap-2 mb-4">
          <span class="text-sm text-sage-300">Примерная стоимость:</span>
          <span id="modal-price" class="text-lg font-bold text-primary"></span>
        </div>
        <div id="modal-links" class="mb-4"></div>
        <button id="btn-modal-close" class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base">
          Закрыть
        </button>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
