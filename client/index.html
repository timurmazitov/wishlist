<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1',
            'primary-dark': '#4f46e5',
            danger: '#ef4444',
            'danger-dark': '#dc2626',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 font-['Roboto'] min-h-screen">

  <div id="app" class="max-w-[480px] mx-auto min-h-screen flex flex-col">

    <main class="flex-1 px-4">
      <!-- Screen 1: Guest Selection -->
      <div id="screen-guest" class="screen pt-8">
        <h1 class="text-2xl font-bold text-center text-primary mb-2">Привет!</h1>
        <h2  class="text-2l font-bold text-gray-500 text-center mb-8">Представься, пожалуйста</h2>
        
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-2" for="guest-select">Гость</label>
          <select id="guest-select" class="w-full px-4 py-3 border border-gray-300 rounded-lg text-base bg-white focus:ring-2 focus:ring-primary focus:border-primary">
            <option value="">Выберите гостя...</option>
          </select>
        </div>
        <button id="btn-select-guest" class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base disabled:opacity-50 disabled:cursor-not-allowed" disabled>
          Выбрать подарок
        </button>
      </div>

      <!-- Screen 2: Gift Selection -->
      <div id="screen-gifts" class="screen pt-4" style="display: none;">
        <h2 class="text-xl font-bold text-primary mb-4">Выберите подарки, <span id="guest-name-display-gifts"></span></h2>
        <div id="gifts-list" class="space-y-3 mb-4"></div>
        <button id="btn-clear-all" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium py-3 rounded-lg text-base mb-4">
          Очистить всё
        </button>
      </div>

      <!-- Screen 3: Saved List -->
      <div id="screen-saved" class="screen pt-4" style="display: none;">
        <h2 class="text-xl font-bold text-primary mb-4">Ваш список подарков, <span id="guest-name-display"></span></h2>
        <div id="saved-list" class="space-y-3 mb-4"></div>
        <div id="send-buttons" class="flex flex-col gap-3 mb-4">
          <div class="flex items-center gap-2">
            <button data-action="restart" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-base font-medium whitespace-nowrap flex-shrink-0">
              В начало
            </button>
            <button id="btn-back" class="flex-1 bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base disabled:opacity-50 disabled:cursor-not-allowed">
              Редактировать
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer id="app-footer" style="display: none;">
      <div id="footer-gifts" style="display: none;" class="px-4 py-3 border-t border-gray-200 bg-white">
        <div id="selection-summary" class="text-xl text-gray-600 text-center mb-3">
          Выбрано: <span id="selected-count">0</span> шт, на сумму ~ <span id="selected-total">0</span> ₽
        </div>
        <div class="flex items-center gap-2">
          <button data-action="restart" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-lg text-base font-medium whitespace-nowrap flex-shrink-0">
            В начало
          </button>
          <button id="btn-clear-footer"  class="bg-danger hover:bg-danger-dark text-white px-3 py-2 rounded-lg text-base font-medium whitespace-nowrap flex-shrink-0">
            Очистить
          </button>
          <button id="btn-save" class="flex-1 bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base disabled:opacity-50 disabled:cursor-not-allowed" disabled>
            Сохранить
          </button>
        </div>
      </div>
    </footer>

    <!-- Modal -->
    <div id="gift-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display: none;">
      <div id="modal-overlay" class="absolute inset-0 bg-black/50"></div>
      <div class="relative bg-white rounded-2xl w-full max-w-[400px] max-h-[80vh] overflow-y-auto p-6 z-10">
        <img id="modal-image" src="" alt="" class="w-full h-48 object-cover rounded-xl mb-4">
        <h3 id="modal-name" class="text-xl font-bold text-gray-900 mb-2"></h3>
        <p id="modal-description" class="text-gray-600 text-sm mb-4"></p>
        <div class="flex items-center gap-2 mb-4">
          <span class="text-sm text-gray-500">Примерная стоимость:</span>
          <span id="modal-price" class="text-lg font-bold text-primary"></span>
        </div>
        <div id="modal-links" class="mb-4"></div>
        <button id="btn-modal-close" class="w-full bg-primary hover:bg-primary-dark text-white font-medium py-3 rounded-lg text-base">
          Закрыть
        </button>
      </div>
    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
